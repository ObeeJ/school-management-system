# NGINX API Gateway & Reverse Proxy Configuration
# Production Topology: NGINX -> Next.js Frontend (frontend:3000) & NestJS Backend (backend:4000)

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_tenant_id"';

    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting Zone: 20 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost scholaria.railway.app *.scholaria.railway.app;

        # Global Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. API Gateway Proxy -> NestJS Backend
        location /api/v1/ {
            limit_req zone=api_limit burst=10 nodelay;

            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tenant Context Propagation Header
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
        }

        # 2. Frontend Application Proxy -> Next.js UI Server
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
